# -Dfile.encoding=UTF-8 é obrigatório aqui: o usuário do Windows é "Usuário"
# (com acento) e sem UTF-8 explícito a JVM lê o caminho como "Usu?rio",
# quebrando o Gradle. Mesma configuração usada no projeto CofreNuvem.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.incremental=false

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
